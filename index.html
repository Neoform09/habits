<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Habits</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f2ec;--card:#fffdf9;--ink:#1c1b19;--mute:#6b675f;--line:#dcd5c9;
  --acc:#2f6f62;--acc-soft:#dcebe6;--pro:#2f5f8f;--per:#9a5a2a;
  --s0:#8a8378;--s1:#c0392b;--s2:#e07b39;--s3:#d9b23a;--s4:#7fae4f;--s5:#2f8f5b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161513;--card:#211f1c;--ink:#eeebe4;--mute:#a29d93;--line:#3a362f;
  --acc:#5fb3a0;--acc-soft:#1f3631;--pro:#7aa8d6;--per:#d99a68;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:500 28px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:140px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h2{font-size:34px;margin:0 0 12px}
main{padding:0 12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}
.mute{color:var(--mute)}
.small{font-size:23px}
[hidden]{display:none!important}


.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 8px;border-bottom:2px solid var(--line)}
.dnav{display:flex;align-items:center;gap:8px}
.dnav button{flex:0 0 64px;height:64px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:36px;font-weight:700}
.dnav .dt{flex:1;text-align:center;font-weight:800;font-size:30px;line-height:1.15}
.dnav .dt small{display:block;font-size:22px;font-weight:600;color:var(--mute)}
.score{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:8px}
.score b{font-size:40px}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:7px}


.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:24px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}


.sec{font-size:26px;font-weight:800;color:var(--mute);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.h{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 14px 12px;margin:0 0 12px}
.h.done{border-color:var(--acc)}
.h .nm{font-weight:700;font-size:29px;line-height:1.25}
.h .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px;align-items:center}
.tag{font-size:20px;font-weight:800;padding:3px 10px;border-radius:8px;border:2px solid}
.tag.pro{color:var(--pro);border-color:var(--pro)}
.tag.per{color:var(--per);border-color:var(--per)}
.pts{margin-left:auto;font-size:22px;font-weight:700;color:var(--mute)}
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rate button{height:66px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:30px}
.rate button.on{color:#fff;border-color:transparent}
.rate button.on[data-q="0"]{background:var(--s0)}
.rate button.on[data-q="1"]{background:var(--s1)}.rate button.on[data-q="2"]{background:var(--s2)}
.rate button.on[data-q="3"]{background:var(--s3);color:#1c1b19}.rate button.on[data-q="4"]{background:var(--s4)}
.rate button.on[data-q="5"]{background:var(--s5)}


nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav.tabs button{border:0;background:none;padding:10px 0;font-weight:800;font-size:24px;border-radius:14px;color:var(--mute)}
nav.tabs button span{display:block;font-size:34px;line-height:1}
nav.tabs button.on{background:var(--acc-soft);color:var(--acc)}


.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.seg button{padding:12px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:26px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big div{background:var(--bg);border-radius:16px;padding:12px}
.big b{display:block;font-size:44px;line-height:1.1}
.big span{font-size:22px;color:var(--mute);font-weight:700}
.row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:25px}
.row .nm{font-weight:800}
.row .v{text-align:right;font-weight:700}
.row .tr{height:28px;background:var(--bg);border-radius:8px;overflow:hidden}
.row .tr i{display:block;height:100%;border-radius:8px}
svg text{font-family:system-ui,sans-serif}
.ht{border-top:2px solid var(--line);padding:10px 0}
.ht:first-of-type{border-top:0}
.ht .a{display:flex;justify-content:space-between;gap:10px;font-size:24px}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{flex:1;height:18px;border-radius:4px;background:var(--line)}


.er{display:flex;align-items:center;gap:8px;border-top:2px solid var(--line);padding:10px 0}
.er:first-child{border-top:0}
.er .t{flex:1;min-width:0}
.er .t b{display:block;font-size:26px;line-height:1.25}
.ib{flex:0 0 auto;width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:28px;font-weight:800}
.btn{display:block;width:100%;padding:16px;border-radius:16px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:28px;margin-top:10px}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn.red{background:#b23b2c}
label.l{display:block;font-weight:800;font-size:24px;margin:14px 0 6px;color:var(--mute)}
input.t,select.t,textarea.t{width:100%;font:600 28px system-ui,sans-serif;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.tagpick button{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:25px}
.tagpick button.on.pro{background:var(--pro);border-color:var(--pro);color:#fff}
.tagpick button.on.per{background:var(--per);border-color:var(--per);color:#fff}
.wrow{display:grid;grid-template-columns:1fr 150px 120px;gap:8px;align-items:center;border-top:2px solid var(--line);padding:8px 0}
.wrow>*{min-width:0}.wrow input.t,.wrow select.t{padding:10px 6px}
.wrow b{font-size:27px}
.wrow small{display:block;font-size:20px;color:var(--mute);font-weight:600}
.num{display:flex;align-items:center;gap:6px}
.num input{width:100%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.modal .card{width:100%;max-height:92vh;overflow:auto;margin:0;border-radius:24px 24px 0 0;padding-bottom:40px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:14px;font-weight:700;font-size:24px;z-index:30}
</style>
</head>

<style>
#appsync{margin:12px 14px;padding:16px 18px;border-radius:16px;border:3px solid #c8643b;background:#fff4ee;color:#1c1b19;font:500 26px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#appsync[hidden]{display:none!important}
#appsync b{display:block;font-size:30px;margin-bottom:6px}
#appsync .as-msg{margin:0 0 12px}
#appsync .as-row{display:flex;gap:10px;flex-wrap:wrap}
#appsync input{flex:1 1 220px;min-width:0;font:600 28px system-ui,sans-serif;padding:12px 14px;border:2px solid #b9b3a8;border-radius:12px;background:#fff;color:#1c1b19}
#appsync button{font:700 28px system-ui,sans-serif;padding:12px 22px;border:0;border-radius:12px;background:#1c1b19;color:#fff;cursor:pointer}
#appsync .as-x{background:transparent;color:#6f6b63;padding:12px 8px;font-weight:600}
@media (prefers-color-scheme:dark){#appsync{background:#2d231e;color:#eeebe4;border-color:#e3855c}#appsync input{background:#161513;color:#eeebe4;border-color:#4a463f}#appsync button{background:#eeebe4;color:#161513}#appsync .as-x{background:transparent;color:#a29d93}}
</style>
<div id="appsync" hidden>
  <b>Send this log to Claude</b>
  <p class="as-msg" id="appsync-msg">Enter your password once. After that, everything you save is sent automatically.</p>
  <div class="as-row"><input id="appsync-pass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="password" aria-label="Password"><button id="appsync-save" type="button">Save</button><button id="appsync-later" class="as-x" type="button">Later</button></div>
</div>
<script>
// Sends saved entries to Igor's "App Logs" Google Sheet. Shared by all his phone apps.
window.AppSync = (function () {
  var URL = "https://script.google.com/macros/s/AKfycbztATiu4PQzOnIuSqcF1AocXGo1RfsupmiqJVyFjFSRJUl5Jb_bS2Y8YTTcJ5IZwO19YQ/exec";
  var KQ = "appsync-queue", KP = "appsync-pass", KL = "appsync-later";
  function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var busy = false, box, msg;

  function showBox(text) {
    if (!box) return;
    if (text) msg.textContent = text;
    box.hidden = false;
  }
  function setup() {
    box = document.getElementById("appsync"); msg = document.getElementById("appsync-msg");
    if (!box) return;
    if (box.parentNode !== document.body || document.body.firstElementChild !== box) document.body.insertBefore(box, document.body.firstChild);
    document.getElementById("appsync-save").addEventListener("click", function () {
      var p = document.getElementById("appsync-pass").value.trim().toLowerCase();
      if (!p) return;
      put(KP, p); put(KL, 0); box.hidden = true; msg.textContent = "Checking…";
      check();
    });
    document.getElementById("appsync-later").addEventListener("click", function () { put(KL, Date.now()); box.hidden = true; });
    if (!get(KP, "") && Date.now() - get(KL, 0) > 12 * 3600 * 1000) showBox();
    setTimeout(flush, 1500);
  }

  function post(body) {
    return fetch(URL, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  // Called after a password is typed: confirms it right away, even with nothing to send.
  function check() {
    var pass = get(KP, "");
    post({ key: pass, app: "_check", id: "check" }).then(function (r) {
      if (r && r.error === "password") { put(KP, ""); showBox("That password didn't work. Please type it again."); return; }
      flush();
    }).catch(function () { flush(); });
  }

  function send(app, entry) {
    if (!entry || !entry.id) return;
    var q = get(KQ, []).filter(function (x) { return !(x.app === app && x.id === entry.id); });
    q.push({ app: app, id: String(entry.id), date: entry.date || "", summary: entry.summary || "", details: entry.details || {} });
    put(KQ, q.slice(-500));
    flush();
  }

  function flush() {
    if (busy) return;
    var q = get(KQ, []);
    if (!q.length) return;
    var pass = get(KP, "");
    if (!pass) { if (Date.now() - get(KL, 0) > 12 * 3600 * 1000) showBox(); return; }
    if (navigator.onLine === false) return;
    busy = true;
    var item = q[0];
    post({ key: pass, app: item.app, id: item.id, date: item.date, summary: item.summary, details: item.details })
      .then(function (r) {
        busy = false;
        if (r && r.ok) {
          put(KQ, get(KQ, []).filter(function (x) { return !(x.app === item.app && x.id === item.id && x.summary === item.summary); }));
          flush();
        } else if (r && r.error === "password") {
          put(KP, ""); showBox("That password didn't work. Please type it again.");
        }
      })
      .catch(function () { busy = false; });
  }

  // Sends an app's existing history once, the first time this code runs on the phone.
  function backfill(name, fn) {
    if (get("appsync-bf-" + name, 0)) return;
    try { fn(); put("appsync-bf-" + name, 1); } catch (e) {}
  }

  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") flush(); });
  setInterval(flush, 60000);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", setup); else setup();
  return { send: send, flush: flush, backfill: backfill };
})();
</script>

<script>
"use strict";

const CODES = [
  ["PP","pro","Planning"],["FIN","pro","Finance"],["EMP","pro","Paid self-employed work"],["JOB","pro","Applying for jobs"],
  ["FILM","pro","Film directing"],["SSS","pro","Stock market / trading"],["BUS","pro","New business ideas"],["ARC","pro","Art, architecture & design"],
  ["SEM","per","Spiritual & emotional mastery"],["FIT","per","Health, sport, food"],["FFF","per","Partner, friends, family"],["HS","per","Lifestyle"],
  ["LLL","per","Learning"],["MM","per","Maintenance, chores"],["OTH","per","Other"]
];
const HABITS = [
  ["SEM PP BUS","D","Visualise: 3Y, Y, 3M, M, 1W, D"],
  ["SEM FFF BUS","D","Measure your attitude: emotions (negative vs positive), energy (high/low), mood (good/bad), write the emotion you feel"],
  ["PP","D","Review and moderate PP: D, W, M"],
  ["PP","M","Review and moderate PP: 3M, 1Y, 3Y"],
  ["PP","D","WRITE day TASK, MAJOR mission. Be an ambitious boss: prepare tasks for your employees (today, tomorrow)"],
  ["PP","W","WRITE week TASK, MAJOR mission"],
  ["FILM PP BUS","D","Do you / did you work on your dream goal today? (future self proud)"],
  ["PP","D","CHECK: do you / did you work on a MAJOR daily TASK"],
  ["PP","M","WRITE month mission in calendar"],
  ["PP","D","Did you work on a MAJOR weekly TASK"],
  ["PP","D","Did you work on a MAJOR monthly TASK"],
  ["PP","D","Rank tasks by importance (20/80)"],
  ["PP","D","Start with the task you like least (eat the frog in the morning)"],
  ["SEM","D","Gratefulness"],
  ["SEM","D","Magic moments"],
  ["SEM","D","Questions"],
  ["SEM","D","Meditate"],
  ["SEM PP LLL","D","Listen to tapes"],
  ["SEM","D","Breathing"],
  ["SEM FFF","D","Did you do something crazy, made somebody smile today?"],
  ["SEM","D","Emotional flood exercise"],
  ["SEM","D","Give! What did you give?"],
  ["SEM","D","Incantations"],
  ["SEM PP","D","Write down the hardest thing to do today"],
  ["SEM PP","D","Do the hardest thing"],
  ["SEM PP","D","What is bothering you? List all things. Why are you doing it? Pleasure you get? What is the pain? What must you change?"],
  ["PP","M","WRITE 3-month mission in calendar"],
  ["FILM LLL","W","Did you watch 5 films this week?"],
  ["FILM LLL","W","Did you read 2 scripts this week?"],
  ["FILM LLL","W","Read or watch an interview about a specific director"],
  ["FIT","W","Did you do FIT sport 4 times this week?"],
  ["FIT","D","Did you avoid bread, pasta, sugar, milk?"],
  ["FIT","D","Did you drink water 3 times a day?"],
  ["FIT","D","No FIT X workout? Alternative?"],
  ["FIT","D","Only 3 coffees a day or less?"],
  ["FFF","W","Organise & meet somebody you haven't seen for a while (every 2 weeks)"],
  ["FFF","W","Did you get to know somebody NEW this week?"],
  ["HS","D","Clean up"],
  ["FIT","D","FIT X awesome counter"],
  ["LLL","D","Learn something new each day and write down what"],
  ["FILM","D","FILM script writing for the waste basket: brainstorm, browse the internet for ideas"],
  ["FIN","W","Check your financials, act in advance"],
  ["FIN","M","Pay bills (10th day of the month)"],
  ["SEM PP","D","PUSH BEYOND WHAT IS EXPECTED"],
  ["SEM","D","Track negative thoughts"],
  ["SEM","D","Gratefulness: what action can I take to show how grateful I am?"]
];
const FREQ = {D:"Daily",W:"Weekly",M:"Monthly"};
const KEY = "habits-v1";


function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){
  let s=null; try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s){
    s={start:todayStr(),groups:{pro:{name:"Professional",w:2},per:{name:"Personal",w:1}},codes:{},habits:[],log:{},nextId:1};
    CODES.forEach((c,i)=>s.codes[c[0]]={g:c[1],w:1,name:c[2],ord:i});
    HABITS.forEach(h=>s.habits.push({id:"h"+(s.nextId++),name:h[2],tags:h[0].split(" "),f:h[1],arch:false}));
  }
  return s;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}


function P(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function add(s,n){const d=P(s);d.setDate(d.getDate()+n);return todayStr(d)}
function monday(s){const d=P(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return todayStr(d)}
function ym(s){return s.slice(0,7)}
function pk(f,date){return f==="D"?"D:"+date:f==="W"?"W:"+monday(date):"M:"+ym(date)}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function nice(s){const d=P(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}


function cw(c){const x=S.codes[c];if(!x)return 0;return (S.groups[x.g]?S.groups[x.g].w:1)*x.w}
function hw(h){return h.tags.reduce((a,c)=>a+cw(c),0)}
function active(f){return S.habits.filter(h=>!h.arch&&(!f||h.f===f))}
function maxOf(f){return active(f).reduce((a,h)=>a+5*hw(h),0)}
function hById(id){return S.habits.find(h=>h.id===id)}
// points of one log bucket, plus per-code and per-group breakdown accumulators
function bucket(k,acc){
  const L=S.log[k];let p=0;if(!L)return 0;
  for(const id in L){const h=hById(id);const q=L[id];if(!h||!q)continue;
    h.tags.forEach(c=>{const v=q*cw(c);p+=v;if(acc){acc.codes[c]=(acc.codes[c]||0)+v;const g=S.codes[c]?S.codes[c].g:"per";acc.groups[g]=(acc.groups[g]||0)+v;}});
  }
  return p;
}
const T=()=>todayStr();
function counted(d){return d>=S.start&&d<=T()}
// period = {type:'D'|'W'|'M', key: date / monday / 'YYYY-MM'}
function period(type,key,acc){
  let pts=0,poss=0;const dM=maxOf("D"),wM=maxOf("W"),mM=maxOf("M");
  if(type==="D"){pts=bucket("D:"+key,acc);poss=counted(key)?dM:0;}
  else if(type==="W"){
    for(let i=0;i<7;i++){const d=add(key,i);pts+=bucket("D:"+d,acc);if(counted(d))poss+=dM;}
    pts+=bucket("W:"+key,acc);if(key<=T()&&add(key,6)>=S.start)poss+=wM;
  } else {
    const [y,m]=key.split("-").map(Number);const n=new Date(y,m,0).getDate();let any=false;
    for(let i=1;i<=n;i++){const d=key+"-"+String(i).padStart(2,"0");pts+=bucket("D:"+d,acc);
      if(counted(d)){poss+=dM;any=true}
      // weekly habits count in the month their week's Monday falls in
      if(P(d).getDay()===1){pts+=bucket("W:"+d,acc);if(d<=T()&&add(d,6)>=S.start)poss+=wM;}
    }
    pts+=bucket("M:"+key,acc);if(any)poss+=mM;
  }
  return {pts,poss,pct:poss?Math.round(pts/poss*100):0};
}
function fmt(n){return (Math.round(n*10)/10).toLocaleString("en-US")}


let view="today",cur=T(),filt="all",sType="D";
const main=document.getElementById("main"),topEl=document.getElementById("top");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tagHtml(c){const x=S.codes[c];return `<span class="tag ${x?x.g:"per"}">${esc(c)}</span>`}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}


function renderTop(){
  if(view!=="today"){topEl.hidden=true;return}
  topEl.hidden=false;
  const d=period("D",cur),w=period("W",monday(cur));
  const isT=cur===T();
  topEl.innerHTML=`<div class="dnav"><button id="prev" aria-label="Previous day">‹</button>
    <div class="dt">${isT?"Today":nice(cur)}<small>${isT?nice(cur):(cur>T()?"future":"past day")}</small></div>
    <button id="next" aria-label="Next day">›</button></div>
    <div class="score"><span><b>${fmt(d.pts)}</b> pts today</span><span class="mute small">${d.pct}% · week ${fmt(w.pts)} pts</span></div>
    <div class="bar"><i style="width:${Math.min(100,d.pct)}%"></i></div>`;
  topEl.querySelector("#prev").onclick=()=>{cur=add(cur,-1);render()};
  topEl.querySelector("#next").onclick=()=>{cur=add(cur,1);render()};
}
function renderToday(){
  const codes=Object.keys(S.codes).sort((a,b)=>S.codes[a].ord-S.codes[b].ord);
  const used=new Set();active().forEach(h=>h.tags.forEach(t=>used.add(t)));
  let html=`<div class="chips">`+[["all","All"],["pro","Professional"],["per","Personal"]].concat(codes.filter(c=>used.has(c)).map(c=>[c,c]))
    .map(([k,l])=>`<button class="chip ${filt===k?"on":""}" data-f="${k}">${l}</button>`).join("")+`</div>`;
  const pass=h=>filt==="all"||(filt==="pro"||filt==="per"?h.tags.some(t=>S.codes[t]&&S.codes[t].g===filt):h.tags.includes(filt));
  ["D","W","M"].forEach(f=>{
    const list=active(f).filter(pass);if(!list.length)return;
    const k=pk(f,cur);const L=S.log[k]||{};
    const done=list.filter(h=>L[h.id]>0).length;
    const lbl=f==="D"?"Daily":f==="W"?"This week":"This month";
    html+=`<div class="sec">${lbl} · ${done}/${list.length}</div>`;
    list.forEach(h=>{
      const q=L[h.id];const has=q!==undefined;
      html+=`<div class="h ${q>0?"done":""}" data-id="${h.id}" data-k="${k}">
        <div class="nm">${esc(h.name)}</div>
        <div class="meta">${h.tags.map(tagHtml).join("")}<span class="pts">${q>0?fmt(q*hw(h))+" / ":""}${fmt(5*hw(h))} pts</span></div>
        <div class="rate">${[0,1,2,3,4,5].map(n=>`<button data-q="${n}" class="${has&&q===n?"on":""}" aria-label="${n?"Quality "+n:"Not done"}">${n?n:"✗"}</button>`).join("")}</div>
      </div>`;
    });
  });
  if(!active().length)html+=`<div class="card">No habits yet. Add them in the Habits tab.</div>`;
  main.innerHTML=html;
  main.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderToday()});
  main.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
    const card=b.closest(".h");const id=card.dataset.id,k=card.dataset.k,q=+b.dataset.q;
    const L=S.log[k]||(S.log[k]={});
    if(L[id]===q)delete L[id];else L[id]=q;
    if(!Object.keys(L).length)delete S.log[k];
    if(cur<S.start&&k.startsWith("D:"))S.start=cur;
    save();queueSync(k);
    const y=window.scrollY;renderTop();renderToday();window.scrollTo(0,y);
  });
}


function color(p){return p>=80?"var(--s5)":p>=60?"var(--s4)":p>=40?"var(--s3)":p>=20?"var(--s2)":"var(--s1)"}
function series(type){
  const out=[];
  if(type==="D"){for(let i=13;i>=0;i--){const d=add(T(),-i);out.push({key:d,lab:P(d).getDate()+"",r:period("D",d)})}}
  else if(type==="W"){let m=monday(T());for(let i=11;i>=0;i--){const k=add(m,-7*i);out.push({key:k,lab:P(k).getDate()+"."+(P(k).getMonth()+1),r:period("W",k)})}}
  else{const d=new Date();for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const k=todayStr(x).slice(0,7);out.push({key:k,lab:MON[x.getMonth()],r:period("M",k)})}}
  return out;
}
function chart(sr){
  const W=640,H=300,pad=36,n=sr.length,bw=(W-10)/n;const mx=Math.max(1,...sr.map(s=>Math.max(s.r.pts,s.r.poss)));
  let g="";
  sr.forEach((s,i)=>{const x=5+i*bw;
    const hp=(H-pad-28)*s.r.poss/mx,h=(H-pad-28)*s.r.pts/mx;
    g+=`<rect x="${x+bw*.12}" y="${H-pad-hp}" width="${bw*.76}" height="${hp}" rx="6" fill="var(--line)"/>`;
    g+=`<rect x="${x+bw*.12}" y="${H-pad-h}" width="${bw*.76}" height="${h}" rx="6" fill="${color(s.r.pct)}"/>`;
    if(s.r.pts>0)g+=`<text x="${x+bw/2}" y="${H-pad-Math.max(h,hp)-8}" font-size="19" font-weight="700" text-anchor="middle" fill="var(--ink)">${s.r.pct}%</text>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" font-size="20" text-anchor="middle" fill="var(--mute)">${s.lab}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Points per period">${g}</svg>`;
}
function renderStats(){
  const sr=series(sType);const now=sr[sr.length-1],prev=sr[sr.length-2];
  const acc={codes:{},groups:{}};
  period(sType,now.key,acc);
  const name={D:"Today",W:"This week",M:"This month"}[sType],pname={D:"Yesterday",W:"Last week",M:"Last month"}[sType];
  const delta=now.r.pts-prev.r.pts;
  let html=`<div class="seg">${["D","W","M"].map(t=>`<button data-t="${t}" class="${sType===t?"on":""}">${{D:"Days",W:"Weeks",M:"Months"}[t]}</button>`).join("")}</div>
  <div class="card"><div class="big">
    <div><span>${name}</span><b>${fmt(now.r.pts)}</b><span>of ${fmt(now.r.poss)} possible · ${now.r.pct}%</span></div>
    <div><span>${pname}</span><b>${fmt(prev.r.pts)}</b><span>${prev.r.pct}% · ${delta>=0?"▲ +":"▼ "}${fmt(delta)} now</span></div>
  </div>${chart(sr)}<div class="small mute">Coloured bar = points earned, grey = possible. Label = % of possible.</div></div>`;
  const gt=Object.values(acc.groups).reduce((a,b)=>a+b,0)||1;
  html+=`<div class="card"><h2>${name}: by group</h2>`+["pro","per"].map(g=>{const v=acc.groups[g]||0;
    return `<div class="row"><span class="nm" style="color:var(--${g})">${g==="pro"?"Prof.":"Pers."}</span><span class="tr"><i style="width:${v/gt*100}%;background:var(--${g})"></i></span><span class="v">${fmt(v)}</span></div>`}).join("")+`</div>`;
  const cs=Object.keys(S.codes).filter(c=>acc.codes[c]).sort((a,b)=>acc.codes[b]-acc.codes[a]);
  const cm=Math.max(1,...cs.map(c=>acc.codes[c]));
  html+=`<div class="card"><h2>${name}: by category</h2>`+(cs.length?cs.map(c=>`<div class="row"><span class="nm">${c}</span><span class="tr"><i style="width:${acc.codes[c]/cm*100}%;background:var(--${S.codes[c].g})"></i></span><span class="v">${fmt(acc.codes[c])}</span></div>`).join(""):`<div class="mute">Nothing rated yet.</div>`)+`</div>`;
  // per habit, last 30 days
  const rows=active().map(h=>{
    let n=0,sum=0,slots=0,dots=[];
    if(h.f==="D"){for(let i=29;i>=0;i--){const d=add(T(),-i);if(!counted(d)){dots.push(null);continue}slots++;const q=(S.log["D:"+d]||{})[h.id];if(q>0){n++;sum+=q}dots.push(q===undefined?null:q)}}
    else if(h.f==="W"){for(let i=7;i>=0;i--){const k=add(monday(T()),-7*i);if(k<monday(S.start)){dots.push(null);continue}slots++;const q=(S.log["W:"+k]||{})[h.id];if(q>0){n++;sum+=q}dots.push(q===undefined?null:q)}}
    else{const d=new Date();for(let i=5;i>=0;i--){const k=todayStr(new Date(d.getFullYear(),d.getMonth()-i,1)).slice(0,7);if(k<S.start.slice(0,7)){dots.push(null);continue}slots++;const q=(S.log["M:"+k]||{})[h.id];if(q>0){n++;sum+=q}dots.push(q===undefined?null:q)}}
    return {h,n,slots,avg:n?sum/n:0,dots};
  }).sort((a,b)=>(b.n/(b.slots||1))-(a.n/(a.slots||1))||b.avg-a.avg);
  html+=`<div class="card"><h2>Habits (last 30 days)</h2><div class="small mute" style="margin-bottom:6px">Done count · average quality. Squares = recent ${"days/weeks/months"} coloured by quality.</div>`+rows.map(r=>`<div class="ht"><div class="a"><b style="font-size:24px">${esc(r.h.name)}</b></div>
    <div class="a mute"><span>${FREQ[r.h.f]} · done ${r.n}/${r.slots}</span><span>avg ${r.n?r.avg.toFixed(1):"–"}</span></div>
    <div class="dots">${r.dots.map(q=>`<i style="${q===null?"":"background:var(--s"+q+")"}"></i>`).join("")}</div></div>`).join("")+`</div>`;
  main.innerHTML=html;
  main.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{sType=b.dataset.t;renderStats()});
}


function renderHabits(){
  let html=`<button class="btn" id="addh">+ Add habit</button><div style="height:12px"></div>`;
  ["D","W","M"].forEach(f=>{
    const list=S.habits.filter(h=>!h.arch&&h.f===f);if(!list.length)return;
    html+=`<div class="sec">${FREQ[f]}</div><div class="card">`+list.map(h=>`<div class="er" data-id="${h.id}">
      <div class="t"><b>${esc(h.name)}</b><div class="meta" style="margin:6px 0 0">${h.tags.map(tagHtml).join("")}<span class="pts">×${fmt(hw(h))}</span></div></div>
      <button class="ib" data-a="up" aria-label="Move up">↑</button><button class="ib" data-a="ed" aria-label="Edit">✎</button></div>`).join("")+`</div>`;
  });
  const arch=S.habits.filter(h=>h.arch);
  if(arch.length)html+=`<div class="sec">Removed (history kept)</div><div class="card">`+arch.map(h=>`<div class="er" data-id="${h.id}"><div class="t"><b class="mute">${esc(h.name)}</b></div><button class="ib" data-a="back" aria-label="Restore">↺</button></div>`).join("")+`</div>`;
  main.innerHTML=html;
  main.querySelector("#addh").onclick=()=>editHabit(null);
  main.querySelectorAll(".er .ib").forEach(b=>b.onclick=()=>{
    const id=b.closest(".er").dataset.id,h=hById(id),a=b.dataset.a;
    if(a==="ed")editHabit(h);
    if(a==="back"){h.arch=false;save();renderHabits()}
    if(a==="up"){const same=S.habits.filter(x=>!x.arch&&x.f===h.f);const i=same.indexOf(h);if(i>0){const o=same[i-1];const ia=S.habits.indexOf(h),ib=S.habits.indexOf(o);S.habits[ia]=o;S.habits[ib]=h;save();renderHabits()}}
  });
}
function editHabit(h){
  const isNew=!h;const d=h?{name:h.name,tags:h.tags.slice(),f:h.f}:{name:"",tags:[],f:"D"};
  const codes=Object.keys(S.codes).sort((a,b)=>S.codes[a].ord-S.codes[b].ord);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>${isNew?"New habit":"Edit habit"}</h2>
    <label class="l">Name</label><textarea class="t" id="hn" rows="3">${esc(d.name)}</textarea>
    <label class="l">How often</label><select class="t" id="hf">${["D","W","M"].map(f=>`<option value="${f}" ${d.f===f?"selected":""}>${FREQ[f]}</option>`).join("")}</select>
    <label class="l">Categories (tap several)</label><div class="tagpick">${codes.map(c=>`<button data-c="${c}" class="${S.codes[c].g} ${d.tags.includes(c)?"on":""}">${c}</button>`).join("")}</div>
    <div class="small mute" id="hwv" style="margin-top:10px"></div>
    <button class="btn" id="hs">Save</button>
    ${isNew?"":`<button class="btn red" id="hd">Remove habit (keeps its history)</button>`}
    <button class="btn ghost" id="hc">Cancel</button></div>`;
  document.body.appendChild(m);
  const upd=()=>{const w=d.tags.reduce((a,c)=>a+cw(c),0);m.querySelector("#hwv").textContent=`Weight ×${fmt(w)} → max ${fmt(5*w)} pts`};upd();
  m.querySelectorAll(".tagpick button").forEach(b=>b.onclick=()=>{const c=b.dataset.c;const i=d.tags.indexOf(c);if(i>=0)d.tags.splice(i,1);else d.tags.push(c);b.classList.toggle("on");upd()});
  m.querySelector("#hc").onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  m.querySelector("#hs").onclick=()=>{
    const name=m.querySelector("#hn").value.trim();if(!name){toast("Give it a name");return}
    if(!d.tags.length){toast("Pick at least one category");return}
    const f=m.querySelector("#hf").value;
    if(isNew)S.habits.push({id:"h"+(S.nextId++),name,tags:d.tags,f,arch:false});
    else{if(h.f!==f){}h.name=name;h.tags=d.tags;h.f=f}
    save();m.remove();renderHabits();toast("Saved");
  };
  if(!isNew)m.querySelector("#hd").onclick=()=>{h.arch=true;save();m.remove();renderHabits();toast("Removed")};
}


function renderWeights(){
  const codes=Object.keys(S.codes).sort((a,b)=>S.codes[a].ord-S.codes[b].ord);
  let html=`<div class="card"><h2>Group weights</h2><div class="small mute">Points = quality (1–5) × sum of the habit's category weights. Category weight = group weight × category factor.</div>`+
    ["pro","per"].map(g=>`<div class="wrow"><b>${S.groups[g].name}</b><span></span><input class="t" type="number" step="0.5" min="0" inputmode="decimal" data-g="${g}" value="${S.groups[g].w}"></div>`).join("")+`</div>`;
  html+=`<div class="card"><h2>Categories</h2><div class="wrow small mute" style="border:0"><span>Code</span><span>Group</span><span>Factor</span></div>`+codes.map(c=>{const x=S.codes[c];
    return `<div class="wrow"><div><b>${c}</b><small>${esc(x.name||"")} · = ${fmt(cw(c))}</small></div>
      <select class="t" data-cg="${c}"><option value="pro" ${x.g==="pro"?"selected":""}>Prof.</option><option value="per" ${x.g==="per"?"selected":""}>Pers.</option></select>
      <input class="t" type="number" step="0.5" min="0" inputmode="decimal" data-c="${c}" value="${x.w}"></div>`}).join("")+
    `<button class="btn ghost" id="addc">+ Add category</button></div>`;
  html+=`<div class="card"><h2>Backup</h2><div class="small mute">Ratings also go to your App Logs sheet automatically.</div>
    <button class="btn ghost" id="exp">Download backup file</button><button class="btn ghost" id="imp">Restore from backup file</button>
    <input type="file" id="impf" accept=".json,application/json" hidden>
    <label class="l">Counting starts on</label><input class="t" type="date" id="st" value="${S.start}"></div>`;
  main.innerHTML=html;
  main.querySelectorAll("[data-g]").forEach(i=>i.onchange=()=>{S.groups[i.dataset.g].w=Math.max(0,+i.value||0);save();renderWeights()});
  main.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{S.codes[i.dataset.c].w=Math.max(0,+i.value||0);save();renderWeights()});
  main.querySelectorAll("[data-cg]").forEach(i=>i.onchange=()=>{S.codes[i.dataset.cg].g=i.value;save();renderWeights()});
  main.querySelector("#addc").onclick=()=>{const c=(prompt("New category code (e.g. FITF)")||"").trim().toUpperCase();if(!c)return;if(S.codes[c]){toast("Already exists");return}
    S.codes[c]={g:"per",w:1,name:"",ord:Object.keys(S.codes).length};save();renderWeights()};
  main.querySelector("#st").onchange=e=>{if(e.target.value){S.start=e.target.value;save();toast("Saved")}};
  main.querySelector("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="habits-backup-"+T()+".json";a.click()};
  main.querySelector("#imp").onclick=()=>main.querySelector("#impf").click();
  main.querySelector("#impf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!x.habits||!x.codes)throw 0;S=x;save();toast("Restored");renderWeights()}catch(err){toast("Not a habits backup")}})};
}


const pend=new Set();let st=null;
function queueSync(k){pend.add(k);clearTimeout(st);st=setTimeout(flushSync,2500)}
function flushSync(){
  if(!window.AppSync)return;
  pend.forEach(k=>{
    const [f,key]=[k[0],k.slice(2)];const L=S.log[k]||{};
    const type=f;const r=period(type,f==="M"?key:key);
    const details={};
    S.habits.filter(h=>h.f===f).forEach(h=>{if(L[h.id]!==undefined)details[h.name]=L[h.id]});
    const done=Object.values(L).filter(q=>q>0).length;
    const lab={D:"Day",W:"Week from",M:"Month"}[f];
    const ownPts=bucket(k);
    AppSync.send("habits",{id:k,date:f==="M"?key+"-01":key,
      summary:`${lab} ${key}: ${fmt(ownPts)} pts from ${FREQ[f].toLowerCase()} habits (${done} done)`+(f==="D"?` · ${r.pct}% of day`:` · whole ${f==="W"?"week":"month"} so far ${fmt(r.pts)} pts, ${r.pct}%`),
      details});
  });
  pend.clear();
}
window.addEventListener("pagehide",flushSync);


function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  renderTop();
  ({today:renderToday,stats:renderStats,habits:renderHabits,weights:renderWeights})[view]();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==="today")cur=T();render();window.scrollTo(0,0)});
// new day while the app stays open
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view==="today")render()});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
